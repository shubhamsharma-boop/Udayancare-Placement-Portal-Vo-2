<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Reset Password | UCPP</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-5">

                <div class="card shadow-sm mt-5">

                    <div class="card-body p-4">

                        <div class="text-center mb-4">

                            <i class="fa-solid fa-lock fa-3x mb-3"></i>

                            <h3>
                                Reset Password
                            </h3>

                            <p class="text-muted">
                                Create a new password for your UCPP account.
                            </p>

                        </div>


                        <form id="resetPasswordForm">


                            <!-- EMAIL -->

                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label">

                                    Email Address

                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    readonly
                                    required>

                            </div>


                            <!-- NEW PASSWORD -->

                            <div class="mb-3">

                                <label
                                    for="newPassword"
                                    class="form-label">

                                    New Password

                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="newPassword"
                                    minlength="8"
                                    autocomplete="new-password"
                                    required>

                                <div class="form-text">

                                    Password must be at least 8 characters.

                                </div>

                            </div>


                            <!-- CONFIRM PASSWORD -->

                            <div class="mb-3">

                                <label
                                    for="confirmPassword"
                                    class="form-label">

                                    Confirm Password

                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="confirmPassword"
                                    minlength="8"
                                    autocomplete="new-password"
                                    required>

                            </div>


                            <!-- SUBMIT -->

                            <button
                                type="submit"
                                class="btn btn-primary w-100">

                                <i class="fa-solid fa-key"></i>
                                Reset Password

                            </button>


                        </form>


                        <div class="text-center mt-3">

                            <a href="candidate-login.html">

                                Back to Login

                            </a>

                        </div>


                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- UCPP API -->

    <script src="js/config.js"></script>

    <script src="js/api.js"></script>

    <script src="js/reset-password.js"></script>

</body>

</html>
